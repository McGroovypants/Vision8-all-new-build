<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision8 Site Editor</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f1729;
  --surface: #1a2332;
  --surface2: #243044;
  --border: #2d3f56;
  --text: #e8e8e8;
  --text-dim: #8899aa;
  --gold: #c8a86e;
  --gold-dim: #a8893e;
  --accent: #4a9eff;
  --danger: #ff5555;
  --success: #44cc66;
  --orange: #ff9933;
  --radius: 8px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}

/* === ACCESS CODE GATE === */
#gate {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  background: var(--bg);
}
.gate-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 48px;
  text-align: center;
  max-width: 400px;
  width: 90%;
}
.gate-box h1 {
  color: var(--gold);
  font-size: 24px;
  margin-bottom: 8px;
}
.gate-box p {
  color: var(--text-dim);
  font-size: 14px;
  margin-bottom: 24px;
}
.gate-input {
  width: 100%;
  padding: 12px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 18px;
  text-align: center;
  letter-spacing: 8px;
  outline: none;
}
.gate-input:focus { border-color: var(--gold); }
.gate-input.error { border-color: var(--danger); animation: shake 0.3s; }
@keyframes shake {
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}
.gate-btn {
  width: 100%;
  padding: 12px;
  margin-top: 16px;
  background: var(--gold);
  color: var(--bg);
  border: none;
  border-radius: var(--radius);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.gate-btn:hover { background: var(--gold-dim); }

/* === MAIN EDITOR === */
#editor {
  display: none;
  flex-direction: column;
  height: 100vh;
}
.editor-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.editor-header h2 { font-size: 16px; color: var(--gold); }
.editor-header .site-name { color: var(--text-dim); font-size: 13px; }
.editor-build-version {
  display: inline-block;
  margin-left: 8px;
  padding: 3px 7px;
  border: 1px solid var(--gold-dim);
  border-radius: 999px;
  color: var(--gold);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.editor-body { display: flex; flex: 1; overflow: hidden; }

/* Preview column */
.preview-col {
  width: 35%;
  min-width: 200px;
  display: flex;
  flex-direction: column;
}
.preview-col .col-header {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface);
}
.col-header h3 { font-size: 13px; font-weight: 600; }
.col-header a {
  color: var(--accent);
  font-size: 12px;
  text-decoration: none;
}
.preview-col iframe {
  flex: 1;
  width: 100%;
  border: none;
  background: #111;
}

/* Section list */
.sections-col {
  width: 200px;
  min-width: 120px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--surface);
}
.sections-col .col-header {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.section-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
}
.section-card {
  padding: 10px 12px;
  margin-bottom: 4px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background 0.15s;
}
.section-card:hover { background: var(--surface2); }
.section-card.active { background: var(--surface2); border-left: 3px solid var(--gold); }
.section-card .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.section-card .badge {
  background: var(--orange);
  color: var(--bg);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 10px;
  margin-left: 8px;
}
.section-card .meta {
  color: var(--text-dim);
  font-size: 11px;
  margin-top: 2px;
}

/* Resize handles */
.resize-handle {
  width: 5px;
  cursor: col-resize;
  background: var(--border);
  flex-shrink: 0;
  transition: background 0.15s;
  position: relative;
  z-index: 10;
}
.resize-handle:hover, .resize-handle.dragging { background: var(--gold); }
.resize-handle::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  left: -3px; right: -3px;
}
body.col-resizing { cursor: col-resize !important; user-select: none !important; }
body.col-resizing iframe { pointer-events: none; }

/* Toast */
.toast-container {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10000;
  pointer-events: none;
}
.toast {
  background: var(--surface2);
  border: 1px solid var(--success);
  color: var(--text);
  padding: 12px 24px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  opacity: 0;
  transform: translateY(-10px);
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: auto;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.fade-out { opacity: 0; transform: translateY(-10px); }

/* Editor panel */
.editor-col {
  flex: 1;
  min-width: 200px;
  overflow-y: auto;
  padding: 20px;
  background: var(--bg);
}
.editor-col h3 {
  color: var(--gold);
  font-size: 18px;
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.editor-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-dim);
  font-size: 15px;
}

.element-group {
  margin-bottom: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
}
.element-group.changed { border-color: var(--orange); }
.element-group .el-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.element-group .el-tag {
  font-size: 11px;
  text-transform: uppercase;
  color: var(--text-dim);
  letter-spacing: 0.5px;
}
.element-group .el-changed {
  font-size: 10px;
  color: var(--orange);
  font-weight: 600;
}
.element-group textarea,
.element-group input[type="text"] {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  outline: none;
}
.element-group textarea:focus,
.element-group input[type="text"]:focus { border-color: var(--gold); }
.element-group textarea { min-height: 60px; }

.reset-btn {
  margin-top: 6px;
  padding: 4px 10px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
}
.reset-btn:hover { border-color: var(--text-dim); color: var(--text); }

/* Image elements */
.img-preview {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}
.img-preview img {
  width: 80px;
  height: 60px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface2);
}
.img-preview .img-info {
  flex: 1;
  font-size: 12px;
  color: var(--text-dim);
  word-break: break-all;
}
.swap-btn {
  padding: 6px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}
.swap-btn:hover { border-color: var(--gold); color: var(--gold); }

/* Video field */
.video-field {
  margin-bottom: 8px;
}
.video-field .video-thumb {
  width: 120px;
  height: 68px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface2);
  margin-bottom: 8px;
}
.video-field .video-url-current {
  font-size: 11px;
  color: var(--text-dim);
  word-break: break-all;
  margin-bottom: 6px;
  max-height: 32px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.video-field input[type="text"] {
  width: 100%;
  padding: 8px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  outline: none;
}
.video-field input[type="text"]:focus { border-color: var(--gold); }
.video-field input[type="text"]::placeholder { color: var(--text-dim); }

/* Deploy bar */
.deploy-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--surface);
  border-top: 1px solid var(--border);
}
.deploy-bar .change-count {
  font-size: 13px;
  color: var(--text-dim);
}
.deploy-bar .change-count strong { color: var(--orange); }
.deploy-btn {
  padding: 8px 24px;
  background: var(--gold);
  color: var(--bg);
  border: none;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.deploy-btn:hover { background: var(--gold-dim); }
.deploy-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.deploy-btn.success { background: var(--success); }
.deploy-btn.error { background: var(--danger); }
.apply-btn {
  padding: 8px 24px;
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold);
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-right: 8px;
}
.apply-btn:hover { background: rgba(200,168,110,0.15); }
.apply-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.apply-btn.success { border-color: var(--success); color: var(--success); }
.back-btn {
  padding: 8px 16px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
}
.back-btn:hover { border-color: var(--text-dim); color: var(--text); }

/* Loading */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,41,0.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: var(--text-dim); margin-top: 12px; font-size: 14px; }

/* Scrollbars */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

/* Resolution warning modal */
.res-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,41,0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}
.res-modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 28px 32px;
  max-width: 440px;
  width: 90%;
  text-align: center;
}
.res-modal h3 {
  color: #ff6b6b;
  font-size: 16px;
  margin-bottom: 12px;
}
.res-modal p {
  color: var(--text-dim);
  font-size: 13px;
  margin-bottom: 20px;
  line-height: 1.5;
}
.res-modal-buttons {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.res-modal-buttons button {
  padding: 10px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
}
.res-modal-buttons .btn-primary {
  background: var(--gold);
  color: var(--bg);
}
.res-modal-buttons .btn-primary:hover { background: var(--gold-dim); }
.res-modal-buttons .btn-secondary {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
}
.res-modal-buttons .btn-secondary:hover { border-color: var(--text-dim); }
</style>
</head>
<body>

<!-- ACCESS CODE GATE -->
<div id="gate">
  <div class="gate-box">
    <h1>Vision8 Editor</h1>
    <p>Enter the access code to continue</p>
    <p>This editor now works without a browser-held publishing credential.</p>
  </div>
</div>

<!-- MAIN EDITOR -->
<div id="editor">
  <div class="editor-header">
    <div>
      <h2>Vision8 Editor</h2>
      <span class="site-name" id="siteLabel"></span>
      <span class="editor-build-version" aria-label="Editor build version">Build v1.1.8</span>
    </div>
  </div>
  <div class="editor-body">
    <div class="preview-col">
      <div class="col-header">
        <h3>Preview</h3>
        <a id="previewLink" href="#" target="_blank">Open site &#8599;</a>
      </div>
      <iframe id="previewFrame" title="Live site preview"></iframe>
    </div>
    <div class="resize-handle" id="resizeHandle1"></div>
    <div class="sections-col">
      <div class="col-header">
        <h3>Sections</h3>
      </div>
      <div class="section-list" id="sectionList"></div>
    </div>
    <div class="resize-handle" id="resizeHandle2"></div>
    <div class="editor-col" id="editorCol">
      <div class="editor-empty">Select a section to edit</div>
    </div>
  </div>
  <div class="deploy-bar">
    <button class="back-btn" onclick="location.reload()">Log Out</button>
    <span class="change-count" id="changeCount">No changes</span>
    <div>
      <button class="apply-btn" id="applyBtn" onclick="applyChanges()" disabled>Apply</button>
      <button class="deploy-btn" id="downloadBtn" onclick="downloadSite()" disabled>Download index.html</button>
    </div>
  </div>
</div>

<!-- LOADING OVERLAY -->
<div id="loadingOverlay" style="display:none" class="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Loading...</div>
</div>

<!-- TOAST NOTIFICATION -->
<div class="toast-container" id="toastContainer">
  <div class="toast" id="toast"></div>
</div>

<input type="file" id="fileChooser" accept="image/*" style="display:none">

<!-- Resolution Warning Modal -->
<div id="resWarningModal" class="res-modal-overlay" style="display:none">
  <div class="res-modal">
    <h3>Image Resolution Warning</h3>
    <p id="resWarningText"></p>
    <div class="res-modal-buttons">
      <button class="btn-primary" onclick="resModalAction('upload')">Upload Larger Version</button>
      <button class="btn-secondary" onclick="resModalAction('anyway')">Use Anyway</button>
    </div>
  </div>
</div>

<script>
// ==========================================
// CONFIG
// ==========================================
const OWNER = 'McGroovypants';
const REPO = 'V8-website-2026';
const FILE_PATH = 'index.html';
const PUBLIC_SOURCE_URL = 'https://raw.githubusercontent.com/' + OWNER + '/' + REPO + '/main/' + FILE_PATH;

// ==========================================
// STATE
// ==========================================
let state = {
  originalHtml: '',
  sections: [],
  selectedSectionId: null,
  pendingImageSwap: null
};

// ==========================================
// UTILITIES
// ==========================================
function show(id) {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('editor').style.display = id === 'editor' ? 'flex' : 'none';
}

function showLoading(text) {
  document.getElementById('loadingText').textContent = text;
  document.getElementById('loadingOverlay').style.display = 'flex';
}
function hideLoading() {
  document.getElementById('loadingOverlay').style.display = 'none';
}

function showToast(message, duration) {
  duration = duration || 5000;
  var toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast show';
  setTimeout(function() {
    toast.className = 'toast fade-out';
    setTimeout(function() { toast.className = 'toast'; }, 300);
  }, duration);
}

function escapeHtml(str) {
  var d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function escapeAttr(str) {
  return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ==========================================
// BLOB PREVIEW
// ==========================================
var currentBlobUrl = null;

function loadBlobPreview(html) {
  if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
  var baseUrl = 'https://' + OWNER + '.github.io/' + REPO + '/';
  var processed = html;
  if (processed.includes('<head>')) {
    processed = processed.replace('<head>', '<head><base href="' + baseUrl + '">');
  }
  var blob = new Blob([processed], { type: 'text/html' });
  currentBlobUrl = URL.createObjectURL(blob);
  document.getElementById('previewFrame').src = currentBlobUrl;
}

// ==========================================
// SECTION MAPPING
// ==========================================
// Map data-v8 attributes to human-readable section names
var SECTION_MAP = {
  'site': { name: 'Site identity', icon: '' },
  'hero': { name: 'Hero', icon: '' },
  'about': { name: 'About', icon: '' },
  'services': { name: 'Services', icon: '' },
  'team': { name: 'Team', icon: '' },
  'testimonials': { name: 'Testimonials', icon: '' },
  'clients': { name: 'Clients', icon: '' },
  'contact': { name: 'Contact', icon: '' }
};

function inferSection(fieldName) {
  if (fieldName === 'logo') return 'site';
  if (fieldName.startsWith('hero')) return 'hero';
  if (fieldName.startsWith('about')) return 'about';
  if (fieldName.startsWith('service')) return 'services';
  if (fieldName.startsWith('team')) return 'team';
  if (fieldName.startsWith('testimonial')) return 'testimonials';
  if (fieldName.startsWith('contact')) return 'contact';
  if (fieldName.startsWith('client')) return 'clients';
  return 'other';
}

// ==========================================
// HTML PARSER -- attribute-based
// ==========================================
function parseHtml(html) {
  var parser = new DOMParser();
  var doc = parser.parseFromString(html, 'text/html');

  // Collect all fields grouped by section
  var sectionData = {};

  function ensureSection(sectionKey) {
    if (!sectionData[sectionKey]) {
      var info = SECTION_MAP[sectionKey] || { name: sectionKey.charAt(0).toUpperCase() + sectionKey.slice(1) };
      sectionData[sectionKey] = {
        id: sectionKey,
        name: info.name,
        textFields: [],
        imageFields: [],
        videoFields: []
      };
    }
    return sectionData[sectionKey];
  }

  // Text fields
  doc.querySelectorAll('[data-v8-field]').forEach(function(el) {
    var fieldName = el.getAttribute('data-v8-field');
    var sectionKey = inferSection(fieldName);
    var section = ensureSection(sectionKey);
    var text = el.textContent.trim();
    section.textFields.push({
      id: fieldName,
      attr: 'data-v8-field',
      attrValue: fieldName,
      tag: el.tagName.toLowerCase(),
      content: text,
      originalContent: text
    });
  });

  // Video fields
  doc.querySelectorAll('[data-v8-video]').forEach(function(el) {
    var videoName = el.getAttribute('data-v8-video');
    var section = ensureSection('services');
    var src = el.getAttribute('data-src') || el.getAttribute('src') || '';
    section.videoFields.push({
      id: videoName,
      attr: 'data-v8-video',
      attrValue: videoName,
      src: src,
      originalSrc: src
    });
  });

  // Image fields -- team photos
  doc.querySelectorAll('[data-v8-img]').forEach(function(el) {
    var imgName = el.getAttribute('data-v8-img');
    var sectionKey = inferSection(imgName);
    var section = ensureSection(sectionKey);
    var src = el.getAttribute('src') || '';
    section.imageFields.push({
      id: imgName,
      attr: 'data-v8-img',
      attrValue: imgName,
      src: src,
      originalSrc: src,
      newFileDataUrl: null,
      newFileName: null
    });
  });

  // Also find team member images by proximity (they use <img> inside [data-v8-team])
  doc.querySelectorAll('[data-v8-team]').forEach(function(teamCard) {
    var memberKey = teamCard.getAttribute('data-v8-team');
    var section = ensureSection('team');
    var img = teamCard.querySelector('.team-photo img');
    if (img) {
      var src = img.getAttribute('src') || '';
      // Avoid duplicates
      var exists = section.imageFields.some(function(f) { return f.id === 'team-photo-' + memberKey; });
      if (!exists) {
        section.imageFields.push({
          id: 'team-photo-' + memberKey,
          selector: '[data-v8-team="' + memberKey + '"] .team-photo img',
          src: src,
          originalSrc: src,
          newFileDataUrl: null,
          newFileName: null
        });
      }
    }
  });

  // Build ordered sections array
  var order = ['site', 'hero', 'about', 'services', 'team', 'testimonials', 'clients', 'contact'];
  var sections = [];
  order.forEach(function(key) {
    if (sectionData[key]) sections.push(sectionData[key]);
  });
  // Add any remaining
  Object.keys(sectionData).forEach(function(key) {
    if (order.indexOf(key) === -1) sections.push(sectionData[key]);
  });

  return sections;
}

// ==========================================
// LOAD SITE
// ==========================================
async function loadSite() {
  showLoading('Fetching public site source...');
  try {
    var response = await fetch(PUBLIC_SOURCE_URL, { cache: 'no-store' });
    if (!response.ok) throw new Error('Source request returned ' + response.status);
    var content = await response.text();
    state.originalHtml = content;

    showLoading('Parsing sections...');
    state.sections = parseHtml(content);
    state.selectedSectionId = state.sections.length > 0 ? state.sections[0].id : null;

    var siteUrl = 'https://' + OWNER + '.github.io/' + REPO + '/';
    document.getElementById('previewLink').href = siteUrl;
    loadBlobPreview(content);
    document.getElementById('siteLabel').textContent = OWNER + '/' + REPO;

    renderSections();
    renderEditor();
    updateChangeCount();
    show('editor');
  } catch (err) {
    alert('Failed to load site: ' + err.message);
    console.error(err);
  } finally {
    hideLoading();
  }
}

// ==========================================
// RENDER SECTION LIST
// ==========================================
function renderSections() {
  var list = document.getElementById('sectionList');
  list.innerHTML = '';

  state.sections.forEach(function(section) {
    var changes = countSectionChanges(section);
    var card = document.createElement('div');
    card.className = 'section-card' + (section.id === state.selectedSectionId ? ' active' : '');
    card.onclick = (function(sid) {
      return function() {
        state.selectedSectionId = sid;
        renderSections();
        renderEditor();
      };
    })(section.id);

    var fieldCount = section.textFields.length + section.videoFields.length + section.imageFields.length;
    var html = '<div>' +
      '<div class="name">' + escapeHtml(section.name) + '</div>' +
      '<div class="meta">' + fieldCount + ' field' + (fieldCount !== 1 ? 's' : '') + '</div>' +
      '</div>';
    if (changes > 0) {
      html += '<span class="badge">' + changes + '</span>';
    }
    card.innerHTML = html;
    list.appendChild(card);
  });
}

function countSectionChanges(section) {
  var count = 0;
  section.textFields.forEach(function(tf) {
    if (tf.content !== tf.originalContent) count++;
  });
  section.videoFields.forEach(function(vf) {
    if (vf.src !== vf.originalSrc) count++;
  });
  section.imageFields.forEach(function(imf) {
    if (imf.src !== imf.originalSrc || imf.newFileDataUrl) count++;
  });
  return count;
}

// ==========================================
// RENDER EDITOR PANEL
// ==========================================
function renderEditor() {
  var col = document.getElementById('editorCol');
  var section = state.sections.find(function(s) { return s.id === state.selectedSectionId; });

  if (!section) {
    col.innerHTML = '<div class="editor-empty">Select a section to edit</div>';
    return;
  }

  var html = '<h3>' + escapeHtml(section.name) + '</h3>';

  // Text fields
  section.textFields.forEach(function(tf) {
    var changed = tf.content !== tf.originalContent;
    var isLong = tf.content.length > 80;
    var label = tf.id.replace(/-/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });

    html += '<div class="element-group' + (changed ? ' changed' : '') + '">' +
      '<div class="el-label">' +
        '<span class="el-tag">' + escapeHtml(label) + '</span>' +
        (changed ? '<span class="el-changed">Modified</span>' : '') +
      '</div>';

    if (isLong) {
      html += '<textarea data-section="' + section.id + '" data-field="' + tf.id + '" data-type="text" ' +
        'oninput="handleTextEdit(this)">' + escapeHtml(tf.content) + '</textarea>';
    } else {
      html += '<input type="text" data-section="' + section.id + '" data-field="' + tf.id + '" data-type="text" ' +
        'oninput="handleTextEdit(this)" value="' + escapeAttr(tf.content) + '">';
    }

    if (changed) {
      html += '<button class="reset-btn" onclick="resetField(\'' + section.id + '\',\'' + tf.id + '\',\'text\')">Reset</button>';
    }
    html += '</div>';
  });

  // Video fields
  section.videoFields.forEach(function(vf) {
    var changed = vf.src !== vf.originalSrc;
    var label = vf.id.replace(/-/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
    var thumbUrl = getVideoThumb(vf.src);

    html += '<div class="element-group' + (changed ? ' changed' : '') + '">' +
      '<div class="el-label">' +
        '<span class="el-tag">Video -- ' + escapeHtml(label) + '</span>' +
        (changed ? '<span class="el-changed">Modified</span>' : '') +
      '</div>' +
      '<div class="video-field">';

    if (thumbUrl) {
      html += '<img class="video-thumb" src="' + escapeAttr(thumbUrl) + '" onerror="this.style.display=\'none\'">';
    }

    var truncated = vf.src.length > 80 ? vf.src.substring(0, 77) + '...' : vf.src;
    html += '<div class="video-url-current">' + escapeHtml(truncated) + '</div>' +
      '<input type="text" data-section="' + section.id + '" data-field="' + vf.id + '" data-type="video" ' +
        'oninput="handleVideoEdit(this)" value="' + escapeAttr(vf.src) + '" ' +
        'placeholder="Paste Cloudinary video URL or public_id">' +
      '</div>';

    if (changed) {
      html += '<button class="reset-btn" onclick="resetField(\'' + section.id + '\',\'' + vf.id + '\',\'video\')">Reset</button>';
    }
    html += '</div>';
  });

  // Image fields
  section.imageFields.forEach(function(imf) {
    var changed = imf.src !== imf.originalSrc || imf.newFileDataUrl;
    var label = imf.id.replace(/-/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
    var imgSrc = imf.newFileDataUrl ? imf.newFileDataUrl : imf.src;

    html += '<div class="element-group' + (changed ? ' changed' : '') + '">' +
      '<div class="el-label">' +
        '<span class="el-tag">Image -- ' + escapeHtml(label) + '</span>' +
        (changed ? '<span class="el-changed">Modified</span>' : '') +
      '</div>' +
      '<div class="img-preview">' +
        '<img src="' + escapeAttr(imgSrc) + '" alt="" onerror="this.style.display=\'none\'">' +
        '<input type="url" class="image-url" data-section="' + section.id + '" data-field="' + imf.id + '" oninput="handleImageUrlEdit(this)" value="' + escapeAttr(imf.src) + '" placeholder="Paste image URL">' +
        '<button class="swap-btn" onclick="startImageSwap(\'' + section.id + '\',\'' + imf.id + '\')">Swap</button>' +
      '</div>';

    if (changed) {
      html += '<button class="reset-btn" onclick="resetField(\'' + section.id + '\',\'' + imf.id + '\',\'image\')">Reset</button>';
    }
    html += '</div>';
  });

  col.innerHTML = html;
}

// ==========================================
// VIDEO THUMBNAIL HELPER
// ==========================================
function getVideoThumb(url) {
  if (!url) return '';
  // Convert cloudinary video URL to thumbnail
  // e.g. .../video/upload/w_720,q_auto/something.mp4 -> .../video/upload/w_200,f_jpg/something.mp4.jpg
  try {
    if (url.indexOf('res.cloudinary.com') !== -1) {
      // Replace transform and add .jpg
      var thumbUrl = url.replace(/\/upload\/[^/]+\//, '/upload/w_200,h_113,c_fill,f_jpg/');
      // Change extension
      thumbUrl = thumbUrl.replace(/\.(mp4|mov|webm)$/i, '.jpg');
      return thumbUrl;
    }
  } catch(e) {}
  return '';
}

// ==========================================
// EVENT HANDLERS
// ==========================================
function handleTextEdit(el) {
  var sectionId = el.dataset.section;
  var fieldId = el.dataset.field;
  var value = el.value;
  var section = state.sections.find(function(s) { return s.id === sectionId; });
  if (!section) return;
  var tf = section.textFields.find(function(t) { return t.id === fieldId; });
  if (tf) {
    tf.content = value;
    updatePreviewField(tf.attr, tf.attrValue, 'text', value);
  }
  renderSections();
  updateChangeCount();
}

function handleVideoEdit(el) {
  var sectionId = el.dataset.section;
  var fieldId = el.dataset.field;
  var value = el.value.trim();
  var section = state.sections.find(function(s) { return s.id === sectionId; });
  if (!section) return;
  var vf = section.videoFields.find(function(v) { return v.id === fieldId; });
  if (vf) {
    // Normalize: if user pastes just a public_id, build full URL
    if (value && value.indexOf('://') === -1 && value.indexOf('res.cloudinary.com') === -1) {
      value = 'https://res.cloudinary.com/deyb4o5qz/video/upload/w_720,q_auto/' + value + '.mp4';
    }
    vf.src = value;
    updatePreviewVideo(vf.attrValue, value);
  }
  renderSections();
  updateChangeCount();
}

function handleImageUrlEdit(el) {
  var section = state.sections.find(function(s) { return s.id === el.dataset.section; });
  if (!section) return;
  var imf = section.imageFields.find(function(i) { return i.id === el.dataset.field; });
  if (!imf) return;
  imf.src = el.value.trim();
  imf.newFileDataUrl = null;
  var selector = imf.selector || ('[' + imf.attr + '=\"' + imf.attrValue + '\"]');
  updatePreviewImageSelector(selector, imf.src);
  renderSections();
  updateChangeCount();
}

function startImageSwap(sectionId, fieldId) {
  state.pendingImageSwap = { sectionId: sectionId, fieldId: fieldId };
  document.getElementById('fileChooser').click();
}

document.getElementById('fileChooser').addEventListener('change', function(e) {
  if (!e.target.files.length || !state.pendingImageSwap) return;
  var file = e.target.files[0];
  var reader = new FileReader();
  reader.onload = function(ev) {
    var dataUrl = ev.target.result;
    var sid = state.pendingImageSwap.sectionId;
    var fid = state.pendingImageSwap.fieldId;
    var section = state.sections.find(function(s) { return s.id === sid; });
    if (!section) return;
    var imf = section.imageFields.find(function(i) { return i.id === fid; });
    if (imf) {
      // Check resolution
      var img = new Image();
      img.onload = function() {
        if (img.naturalWidth < 400) {
          document.getElementById('resWarningText').textContent =
            'This image is only ' + img.naturalWidth + 'px wide. For best display we recommend at least 400px wide.';
          document.getElementById('resWarningModal').style.display = 'flex';
          // Store pending data for modal actions
          state.pendingImageData = { section: section, field: imf, dataUrl: dataUrl, fileName: file.name.toLowerCase().replace(/\s+/g, '-') };
        } else {
          applyImageSwap(section, imf, dataUrl, file.name.toLowerCase().replace(/\s+/g, '-'));
        }
      };
      img.src = ev.target.result;
    }
    state.pendingImageSwap = null;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

function applyImageSwap(section, imf, dataUrl, fileName) {
  imf.newFileDataUrl = dataUrl;
  imf.newFileName = fileName;
  var selector = imf.selector || ('[' + imf.attr + '=\"' + imf.attrValue + '\"]');
  updatePreviewImageSelector(selector, dataUrl);
  renderEditor();
  renderSections();
  updateChangeCount();
}

function resModalAction(action) {
  var modal = document.getElementById('resWarningModal');
  modal.style.display = 'none';
  if (action === 'upload') {
    // Re-open file chooser
    if (state.pendingImageData) {
      state.pendingImageSwap = {
        sectionId: state.pendingImageData.section.id,
        fieldId: state.pendingImageData.field.id
      };
    }
    document.getElementById('fileChooser').click();
  } else if (action === 'anyway' && state.pendingImageData) {
    var d = state.pendingImageData;
    applyImageSwap(d.section, d.field, d.dataUrl, d.fileName);
  }
  state.pendingImageData = null;
}

function resetField(sectionId, fieldId, type) {
  var section = state.sections.find(function(s) { return s.id === sectionId; });
  if (!section) return;
  if (type === 'text') {
    var tf = section.textFields.find(function(t) { return t.id === fieldId; });
    if (tf) {
      tf.content = tf.originalContent;
      updatePreviewField(tf.attr, tf.attrValue, 'text', tf.originalContent);
    }
  } else if (type === 'video') {
    var vf = section.videoFields.find(function(v) { return v.id === fieldId; });
    if (vf) {
      vf.src = vf.originalSrc;
      updatePreviewVideo(vf.attrValue, vf.originalSrc);
    }
  } else if (type === 'image') {
    var imf = section.imageFields.find(function(i) { return i.id === fieldId; });
    if (imf) {
      imf.src = imf.originalSrc;
      imf.newFileDataUrl = null;
      imf.newFileName = null;
      var selector = imf.selector || ('[' + imf.attr + '=\"' + imf.attrValue + '\"]');
      updatePreviewImageSelector(selector, imf.originalSrc);
    }
  }
  renderEditor();
  renderSections();
  updateChangeCount();
}

// ==========================================
// INSTANT PREVIEW UPDATES
// ==========================================
function updatePreviewField(attr, attrValue, type, value) {
  try {
    var iframe = document.getElementById('previewFrame');
    var iDoc = iframe.contentDocument || iframe.contentWindow.document;
    if (!iDoc) return;
    var el = iDoc.querySelector('[' + attr + '="' + attrValue + '"]');
    if (!el) return;
    if (type === 'text') {
      el.textContent = value;
    }
  } catch (e) { /* cross-origin silently skip */ }
}

function updatePreviewVideo(attrValue, newSrc) {
  try {
    var iframe = document.getElementById('previewFrame');
    var iDoc = iframe.contentDocument || iframe.contentWindow.document;
    if (!iDoc) return;
    var el = iDoc.querySelector('[data-v8-video="' + attrValue + '"]');
    if (!el) return;
    el.setAttribute('data-src', newSrc);
    // If video has already loaded (has src), update src too
    if (el.src) {
      el.src = newSrc;
    }
  } catch (e) { /* cross-origin silently skip */ }
}

function updatePreviewImageSelector(selector, newSrc) {
  try {
    var iframe = document.getElementById('previewFrame');
    var iDoc = iframe.contentDocument || iframe.contentWindow.document;
    if (!iDoc) return;
    var el = iDoc.querySelector(selector);
    if (!el) return;
    el.setAttribute('src', newSrc);
  } catch (e) { /* cross-origin silently skip */ }
}

// ==========================================
// CHANGE TRACKING
// ==========================================
function updateChangeCount() {
  var total = 0;
  state.sections.forEach(function(s) { total += countSectionChanges(s); });
  var el = document.getElementById('changeCount');
  var btn = document.getElementById('downloadBtn');
  var applyBtn = document.getElementById('applyBtn');
  if (total === 0) {
    el.innerHTML = 'No changes';
    btn.disabled = true;
    btn.className = 'deploy-btn';
    applyBtn.disabled = true;
    applyBtn.className = 'apply-btn';
  } else {
    el.innerHTML = '<strong>' + total + '</strong> pending change' + (total !== 1 ? 's' : '');
    btn.disabled = false;
    btn.className = 'deploy-btn';
    applyBtn.disabled = false;
    applyBtn.className = 'apply-btn';
  }
}

// ==========================================
// BUILD MODIFIED HTML
// ==========================================
function buildModifiedHtml(forPreview) {
  var parser = new DOMParser();
  var doc = parser.parseFromString(state.originalHtml, 'text/html');

  state.sections.forEach(function(section) {
    // Apply text field changes
    section.textFields.forEach(function(tf) {
      if (tf.content === tf.originalContent) return;
      try {
        var el = doc.querySelector('[' + tf.attr + '="' + tf.attrValue + '"]');
        if (el) el.textContent = tf.content;
      } catch(e) { console.warn('Selector failed:', tf.attrValue, e); }
    });

    // Apply video field changes
    section.videoFields.forEach(function(vf) {
      if (vf.src === vf.originalSrc) return;
      try {
        var el = doc.querySelector('[' + vf.attr + '="' + vf.attrValue + '"]');
        if (!el) return;
        // Update data-src and src if present
        if (el.hasAttribute('data-src')) {
          el.setAttribute('data-src', vf.src);
        }
        if (el.hasAttribute('src')) {
          el.setAttribute('src', vf.src);
        }
        // If no src and no data-src, set data-src
        if (!el.hasAttribute('data-src') && !el.hasAttribute('src')) {
          el.setAttribute('data-src', vf.src);
        }
      } catch(e) { console.warn('Video selector failed:', vf.attrValue, e); }
    });

    // Apply image field changes
    section.imageFields.forEach(function(imf) {
      if (imf.src === imf.originalSrc && !imf.newFileDataUrl) return;
      try {
        var el;
        if (imf.selector) {
          el = doc.querySelector(imf.selector);
        }
        if (!el && imf.attr) {
          el = doc.querySelector('[' + imf.attr + '="' + imf.attrValue + '"]');
        }
        if (!el) return;
        if (imf.newFileDataUrl) {
          el.setAttribute('src', imf.newFileDataUrl);
        } else {
          el.setAttribute('src', imf.src);
        }
      } catch(e) { console.warn('Image selector failed:', imf.id, e); }
    });
  });

  return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
}

// ==========================================
// APPLY (preview only)
// ==========================================
function applyChanges() {
  var btn = document.getElementById('applyBtn');
  btn.disabled = true;
  btn.textContent = 'Applying...';

  try {
    var previewHtml = buildModifiedHtml(true);
    loadBlobPreview(previewHtml);

    btn.textContent = 'Applied!';
    btn.className = 'apply-btn success';
    setTimeout(function() {
      btn.textContent = 'Apply';
      btn.className = 'apply-btn';
      updateChangeCount();
    }, 2000);
  } catch (err) {
    console.error('Apply failed:', err);
    btn.textContent = 'Apply';
    btn.className = 'apply-btn';
    updateChangeCount();
  }
}

// ==========================================
// DOWNLOAD FOR PUBLISHING
// ==========================================
function downloadSite() {
  try {
    var html = buildModifiedHtml(false);
    var blob = new Blob([html], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = 'index.html';
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
    showToast('Downloaded index.html. Replace the project file in VS Code, then commit and publish.', 7000);
  } catch (err) {
    alert('Download failed: ' + err.message);
    console.error(err);
  }
}

// Load the public source directly. Publishing is deliberately handled outside the browser.
loadSite();

// ==========================================
// COLUMN RESIZE
// ==========================================
(function() {
  function setupResize(handleId) {
    var handle = document.getElementById(handleId);
    if (!handle) return;
    var dragging = false, startX, startLeftW, startRightW, leftEl, rightEl;

    handle.addEventListener('mousedown', function(e) {
      e.preventDefault();
      leftEl = handle.previousElementSibling;
      rightEl = handle.nextElementSibling;
      startX = e.clientX;
      startLeftW = leftEl.getBoundingClientRect().width;
      startRightW = rightEl.getBoundingClientRect().width;
      dragging = true;
      handle.classList.add('dragging');
      document.body.classList.add('col-resizing');
    });

    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      var dx = e.clientX - startX;
      var newLeft = Math.max(120, startLeftW + dx);
      var newRight = Math.max(120, startRightW - dx);
      if (newLeft >= 120 && newRight >= 120) {
        leftEl.style.width = newLeft + 'px';
        leftEl.style.flex = 'none';
        if (rightEl.classList.contains('editor-col')) {
          rightEl.style.flex = '1';
        } else {
          rightEl.style.width = newRight + 'px';
          rightEl.style.flex = 'none';
        }
      }
    });

    document.addEventListener('mouseup', function() {
      if (!dragging) return;
      dragging = false;
      handle.classList.remove('dragging');
      document.body.classList.remove('col-resizing');
    });
  }

  setupResize('resizeHandle1');
  setupResize('resizeHandle2');
})();
</script>
